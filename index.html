  function drawMeter(x, y, w, label, ratio, color, valueText) {
    const labelW = 64;
    drawTracked(label, x, y + 7, 8, 'rgba(137,165,177,.8)', 'left', 1.2);
    const barX = x + labelW;
    const barW = w - labelW;
    ctx.fillStyle = 'rgba(255,255,255,.06)';
    ctx.fillRect(barX, y, barW, 8);
    ctx.strokeStyle = 'rgba(255,255,255,.08)';
    ctx.strokeRect(barX + .5, y + .5, barW - 1, 7);
    if (ratio > 0) {
      ctx.fillStyle = color;
      ctx.fillRect(barX + 1, y + 1, (barW - 2) * clamp(ratio, 0, 1), 6);
      ctx.fillStyle = 'rgba(255,255,255,.35)';
      ctx.fillRect(barX + 1, y + 1, (barW - 2) * clamp(ratio, 0, 1), 1);
    }
    drawText(valueText, x + w, y + 7, 8, ratio > 0 ? color : 'rgba(120,140,150,.55)', 'right', '700', MONO);

  function drawReticle(cx, cy, radius, color, alpha) {
    ctx.save();
    ctx.globalAlpha = alpha;
    ctx.strokeStyle = color;
    ctx.lineWidth = 1;
    ctx.beginPath();
    ctx.arc(cx, cy, radius, 0, Math.PI * 2);
    ctx.stroke();
    ctx.setLineDash([3, 9]);
    ctx.lineDashOffset = elapsed * 8;
    ctx.beginPath();
    ctx.arc(cx, cy, radius + 13, 0, Math.PI * 2);
    ctx.stroke();
    ctx.setLineDash([]);
    for (let i = 0; i < 4; i++) {
      const a = i * Math.PI / 2 + Math.PI / 4;
      ctx.beginPath();
      ctx.moveTo(cx + Math.cos(a) * (radius + 5), cy + Math.sin(a) * (radius + 5));
      ctx.lineTo(cx + Math.cos(a) * (radius + 16), cy + Math.sin(a) * (radius + 16));
      ctx.stroke();
    }
    ctx.fillStyle = color;
    ctx.fillRect(cx - 1, cy - 1, 2, 2);
    ctx.restore();
  }

    ctx.fillRect(px + 24, py + 23, 30, 2);
    drawTracked('SECTOR CLEARED', px + pw / 2, py + 76, 25, '#5ef2c2', 'center', 3.5, '900', DISPLAY);
    drawTracked('AREA SECURED // ALL HOSTILES ELIMINATED', px + pw / 2, py + 98, 7,
      'rgba(148,184,188,.78)', 'center', 1.7);
    drawText('+ ' + clearBonus, px + pw / 2, py + 131, 18, '#f4c542', 'center', '900', MONO);
    drawText('BONUS', px + pw + 4, py + 131, 7, 'rgba(244,197,66,.45)', 'right');

    const ratio = 1 - clamp(stateTimer / 3.4, 0, 1);
    const bx = px + 34, by = py + 152, bw = pw - 68;
    ctx.fillStyle = 'rgba(255,255,255,.07)';
    ctx.fillRect(bx, by, bw, 4);
    ctx.fillStyle = '#5ef2c2';
    ctx.fillRect(bx, by, bw * ratio, 4);
    ctx.fillStyle = 'rgba(255,255,255,.45)';
    ctx.fillRect(bx, by, bw * ratio, 1);
    drawTracked('ADVANCING TO SECTOR ' + pad(stage + 1), px + pw / 2, py + 181, 8,
      'rgba(181,216,216,.75)', 'center', 1.8);
    ctx.restore();
  }

  function drawGameOverOverlay() {
    const pw = 450, ph = 312;
    const px = (W - pw) / 2, py = (H - ph) / 2;
    ctx.save();
    ctx.fillStyle = 'rgba(2,5,8,.82)';
    ctx.fillRect(0, 0, W, H);
    drawPanel(px, py, pw, ph, {
      top: 'rgba(25,13,13,.97)',
      bottom: 'rgba(7,9,11,.99)',
      border: 'rgba(255,93,93,.32)',
      cut: 12
    });
    ctx.fillStyle = 'rgba(255,93,93,.75)';
    ctx.fillRect(px + 26, py + 24, 36, 2);

    drawTracked('MISSION FAILED', px + pw / 2, py + 79, 31, '#ff6d63', 'center', 3.5, '900', DISPLAY);
    drawTracked(endReason || 'SYSTEM OFFLINE', px + pw / 2, py + 104, 9,
      'rgba(206,160,155,.82)', 'center', 2.2);

    ctx.strokeStyle = 'rgba(255,255,255,.08)';
    ctx.beginPath();
    ctx.moveTo(px + 36, py + 124.5); ctx.lineTo(px + pw - 36, py + 124.5);
    ctx.stroke();

    const stats = [
      ['SCORE', String(score).padStart(7, '0'), '#edf6f8'],
      ['SECTOR', pad(stage), '#f4c542'],
      ['HI-SCORE', String(highScore).padStart(7, '0'), '#f4c542']
    ];
    stats.forEach((s, i) => {
      const sx = px + 58 + i * 118;
      drawTracked(s[0], sx, py + 154, 8, 'rgba(127,151,159,.8)', 'left', 1.6);
      drawText(s[1], sx, py + 178, 16, s[2], 'left', '900', MONO);
    });

    if (newHighThisRun) {
      const a = .55 + Math.sin(elapsed * 6) * .4;
      drawTracked('★ NEW HIGH SCORE ★', px + pw / 2, py + 215, 12,
        '#ffe172', 'center', 2.3, '700', MONO, a);
    } else {
      drawTracked('DEFEND AGAIN. HOLD THE LINE.', px + pw / 2, py + 215, 8,
        'rgba(139,168,179,.6)', 'center', 2);
    }

    const promptA = .55 + Math.sin(elapsed * 4.2) * .35;
    drawText('PRESS ENTER / CLICK TO RETRY', px + pw / 2, py + 260, 10,
      '#f0f7f8', 'center', '700', MONO, promptA);
    ctx.restore();
  }

  // ═══════════════════════════════════════════════════════════════
  //  RENDER
  // ═══════════════════════════════════════════════════════════════
  function render() {
    drawBackdrop();

    if (state === 'menu') {
      drawField();
      drawHUD();
      drawMenuOverlay();
      return;
    }

    drawField();
    drawHUD();

    if (state === 'playing' && introTimer > 0) drawStageIntro();
    if (state === 'paused') drawPauseOverlay();
    if (state === 'stageclear') drawStageClearOverlay();
    if (state === 'gameover') drawGameOverOverlay();
  }

  // ═══════════════════════════════════════════════════════════════
  //  BOOT
  // ═══════════════════════════════════════════════════════════════
  prepareLevel(1);
  player = createPlayerTank();
  player.active = false;
  theme = THEMES[0];
  syncUI();
  requestAnimationFrame(loop);
})();
</script>
</body>
</html>
